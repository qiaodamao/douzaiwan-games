<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>都在玩 - 小游戏免费在线玩</title>
<meta name="description" content="都在玩聚合站，收录多款免费H5网页小游戏：休闲、益智、射击、动作、棋牌、体育，打开即玩无需下载。">
<link rel="icon" type="image/svg+xml" href="images/logo-d.svg">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#1E1E1E">
<style>
  :root {
    --bg: #ffffff;
    --card: #ffffff;
    --text: #1f2330;
    --sub: #6b7280;
    --brand1: #6366f1;
    --brand2: #8b5cf6;
    --hot: #f43f5e;
    --radius: 16px;
    --shadow: 0 2px 10px rgba(31,35,48,.07);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { overflow-y: scroll; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-tap-highlight-color: transparent;
  }
  a { text-decoration: none; color: inherit; }

  /* ===== 顶部导航 ===== */
  .navbar {
    position: sticky; top: 0; z-index: 20;
    background: rgba(255,255,255,.92); backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .navbar-inner {
    width: 100%; padding: 0 20px; position: relative;
    height: 56px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  }
  .logo {
    justify-self: start; display: flex; align-items: center; gap: 7px;
    font-size: 19px; font-weight: 700; color: var(--text); white-space: nowrap;
  }
  .logo .paw { width: 24px; height: 24px; display: block; border-radius: 6px; }
  .nav-menu {
    justify-self: center; display: flex; align-items: center; justify-content: center; gap: 10px;
    max-width: 100%; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .nav-menu::-webkit-scrollbar { display: none; }
  .nav-item {
    flex: none; padding: 7px 13px; border-radius: 10px;
    font-size: 14.5px; font-weight: 500; color: var(--sub);
    cursor: pointer; user-select: none; white-space: nowrap;
    transition: all .15s;
  }
  .nav-item:hover { color: var(--text); background: #f3f4f6; border-radius: 999px; }
  .nav-item.active { color: #fff; background: #111111; border-radius: 999px; }
  .nav-right { justify-self: end; }
  .menu-toggle {
    display: none; justify-self: center; align-items: center; justify-content: center;
    width: 38px; height: 38px; border: none; cursor: pointer; background: transparent; color: var(--text);
  }
  .menu-toggle svg { width: 22px; height: 22px; }
  .navbar .btn-lucky { height: 34px; font-size: 13.5px; padding: 0 16px; border-radius: 999px; }

  /* ===== 搜索条 ===== */
  .toolbar-wrap { max-width: 1440px; margin: 28px auto 0; padding: 0 20px; scroll-margin-top: 66px; }
  .toolbar {
    background: var(--card); border-radius: var(--radius);
    box-shadow: 0 8px 24px rgba(31,35,48,.10);
    padding: 14px;
  }
  .search-row { display: flex; gap: 10px; }
  .search-box {
    flex: 1; display: flex; align-items: center; gap: 8px;
    background: #f3f4f6; border-radius: 12px; padding: 11px 14px;
    border: 2px solid transparent; transition: border .15s;
  }
  .search-box:focus-within { border-color: var(--brand1); background: #fff; }
  .search-box svg { flex: none; opacity: .55; }
  .search-box input {
    flex: 1; border: none; outline: none; background: transparent;
    font-size: 15px; color: var(--text);
  }
  .btn-lucky {
    flex: none; border: none; cursor: pointer;
    background: #0f97cc;
    color: #fff; font-size: 15px; font-weight: 400;
    padding: 0 20px; border-radius: 999px;
    transition: transform .12s, box-shadow .12s, background .15s;
  }
  .btn-lucky:active { transform: translateY(0); }

  /* ===== 游戏网格 ===== */
  main { max-width: 1440px; margin: 26px auto 60px; padding: 0 20px; }
  .grid-info { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .grid-info h2 { font-size: 19px; }
  .grid-info span { font-size: 13px; color: var(--sub); }
  .section { margin-bottom: 46px; }
  .section:last-child { margin-bottom: 0; }
  .grid {
    display: grid; gap: 64px 56px;
    grid-template-columns: repeat(7, 1fr);
  }
  .card { display: block; }
  .thumb {
    aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center;
    font-size: 52px; position: relative; overflow: hidden;
    background: var(--card); border-radius: var(--radius);
  }
  .thumb img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; display: block; z-index: 1;
  }
  .badge-cat {
    position: absolute; top: 8px; right: 8px; z-index: 2; font-style: normal;
    background: rgba(255,255,255,.85); backdrop-filter: blur(4px);
    color: var(--sub); font-size: 11px; padding: 2px 8px; border-radius: 999px;
  }
  .card-title {
    margin-top: 9px; padding: 0 2px; text-align: center;
    font-size: 14px; font-weight: 500; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .empty { text-align: center; color: var(--sub); padding: 60px 0; font-size: 15px; grid-column: 1/-1; }

  /* ===== 页脚 ===== */
  footer {
    text-align: center; color: var(--sub); font-size: 13px;
    padding: 26px 20px 40px; border-top: 1px solid #e8eaf1; background: #fff;
  }
  footer a { color: var(--brand1); }

  @media (max-width: 1100px) {
    .grid { grid-template-columns: repeat(5, 1fr); gap: 48px 36px; }
  }

  @media (max-width: 768px) {
    .nav-menu {
      position: absolute; top: 100%; left: 0; right: 0;
      justify-self: stretch;
      background: #fff; padding: 10px 30px; margin: 0;
      box-shadow: 0 10px 28px rgba(0,0,0,.14); border-radius: 0 0 16px 16px;
      display: none;
    }
    /* 展开时一行一项，撑满宽度（左右留 30px），高度不超过视口剩余空间 */
    .nav-menu.open {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      gap: 2px;
      max-height: calc(100vh - 66px);
      overflow-y: auto;
    }
    .nav-item { width: 100%; padding: 11px 0; border-radius: 12px; font-size: 15px; text-align: center; }
    .navbar-inner { grid-template-columns: 1fr auto auto; }
    .nav-right { order: 1; }
    .menu-toggle { display: inline-flex; order: 2; justify-self: end; }
  }

  @media (max-width: 480px) {
    .navbar-inner { padding: 0 14px; height: 50px; }
    .logo { font-size: 16px; }
    .logo .paw { width: 34px; height: 34px; }
    .toolbar-wrap { margin-top: 16px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 40px 24px; }
    .thumb { font-size: 44px; }
  }
</style>
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <a class="logo" href="index.html"><img class="paw" src="images/logo-d.svg" alt="logo">都在玩</a>
    <div class="nav-menu" id="navMenu">
      <span class="nav-item active" data-nav="全部">首页</span>
      <span class="nav-item" data-nav="__hot__">热门</span>
      <span class="nav-item" data-nav="休闲">休闲</span>
      <span class="nav-item" data-nav="益智">益智</span>
      <span class="nav-item" data-nav="射击">射击</span>
      <span class="nav-item" data-nav="动作">动作</span>
      <span class="nav-item" data-nav="棋牌">棋牌</span>
      <span class="nav-item" data-nav="体育">体育</span>
      <span class="nav-item" data-nav="策略">策略</span>
    </div>
    <button class="menu-toggle" id="menuToggle" aria-label="菜单">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="nav-right">
      <button class="btn-lucky" id="lucky" title="随机玩一款">🎲 随机玩</button>
    </div>
  </div>
</nav>

<div class="toolbar-wrap">
  <div class="toolbar">
    <div class="search-row">
      <div class="search-box">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="搜索游戏名，如：2048、飞机、贪吃蛇…" autocomplete="off">
      </div>
    </div>
  </div>
</div>

<main id="sections"></main>

<footer>
  都在玩 · 共收录 <b id="footCount">80</b> 款免费 H5 小游戏 · 素材来源于网络，仅供学习交流
</footer>

<script src="data.js"></script>
<script>
(function () {
  var games = window.GAMES || [];
  var GRADS = [
    ["#ffe4e6", "#fecdd3"], ["#e0e7ff", "#c7d2fe"], ["#d1fae5", "#a7f3d0"],
    ["#fef3c7", "#fde68a"], ["#fce7f3", "#fbcfe8"], ["#ccfbf1", "#99f6e4"],
    ["#ede9fe", "#ddd6fe"], ["#ffedd5", "#fed7aa"]
  ];

  var sections = document.getElementById("sections");
  var searchInput = document.getElementById("search");
  var activeCat = "全部";
  var keyword = "";
  var idColl = new Intl.Collator(undefined, { numeric: true });
  var CAT_ORDER = ["休闲", "益智", "射击", "动作", "棋牌", "体育", "策略"];

  document.getElementById("footCount").textContent = games.length;

  function hashStr(s) { var h = 0; for (var i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) >>> 0; } return h; }

  function cardHTML(g) {
    var grad = GRADS[hashStr(g.title) % GRADS.length];
    return '<a class="card" href="g/' + g.id + '.html">' +
      '<div class="thumb" style="background:linear-gradient(135deg,' + grad[0] + ',' + grad[1] + ')">' +
        (g.img ? '<img src="' + g.img + '" alt="' + g.title + '" loading="lazy" onerror="this.remove()">' : '') +
        '<i class="badge-cat">' + g.cat + '</i>' +
      '</div>' +
      '<h3 class="card-title">' + g.title + '</h3>' +
    '</a>';
  }

  function sectionHTML(title, list) {
    return '<section class="section">' +
      '<div class="grid-info"><h2>' + title + '</h2><span>共 ' + list.length + ' 款</span></div>' +
      '<div class="grid">' + list.map(cardHTML).join("") + '</div>' +
    '</section>';
  }

  function render() {
    var list = games.filter(function (g) {
      var okCat = activeCat === "全部" || activeCat === "__hot__" ? true : g.cat === activeCat;
      if (activeCat === "__hot__") okCat = g.hot;
      var okKw = !keyword || g.title.toLowerCase().indexOf(keyword) > -1 || g.cat.indexOf(keyword) > -1;
      return okCat && okKw;
    });
    // 热门优先
    list.sort(function (a, b) { return (b.hot - a.hot) || idColl.compare(String(a.id), String(b.id)); });
    if (!list.length) {
      sections.innerHTML = '<div class="empty">😵 没找到相关游戏，换个关键词试试吧</div>';
      return;
    }
    var html;
    if (activeCat === "全部") {
      // 首页视图：第一个区块展示热门游戏，其后按分类分组（分类顺序与导航一致）
      var hot = list.filter(function (g) { return g.hot; });
      html = hot.length ? sectionHTML("🔥 热门游戏", hot) : "";
      var groups = {};
      for (var i = 0; i < list.length; i++) (groups[list[i].cat] = groups[list[i].cat] || []).push(list[i]);
      var cats = Object.keys(groups).sort(function (a, b) {
        var ia = CAT_ORDER.indexOf(a); if (ia < 0) ia = 99;
        var ib = CAT_ORDER.indexOf(b); if (ib < 0) ib = 99;
        return ia - ib;
      });
      for (var j = 0; j < cats.length; j++) html += sectionHTML(cats[j] + "游戏", groups[cats[j]]);
    } else {
      html = sectionHTML(activeCat === "__hot__" ? "🔥 热门推荐" : activeCat + "游戏", list);
    }
    sections.innerHTML = html;
  }

  function renderNav() {
    var items = document.querySelectorAll(".nav-item");
    for (var i = 0; i < items.length; i++) {
      items[i].classList.toggle("active", items[i].dataset.nav === activeCat);
    }
  }

  function setCat(cat) {
    activeCat = cat;
    // 分类写入 URL hash，从游戏页返回后可恢复
    try {
      history.replaceState(null, "", cat === "全部" ? location.pathname + location.search : "#cat=" + encodeURIComponent(cat));
    } catch (e) {}
    renderNav(); render();
  }

  document.getElementById("navMenu").addEventListener("click", function (e) {
    var el = e.target.closest(".nav-item");
    if (!el) return;
    setCat(el.dataset.nav);
    document.getElementById("navMenu").classList.remove("open");
    // 原地切换，保持当前视口位置，避免页面上下跳动
  });

  document.getElementById("menuToggle").addEventListener("click", function () {
    document.getElementById("navMenu").classList.toggle("open");
  });
  document.addEventListener("click", function (e) {
    var nav = document.getElementById("navMenu");
    if (!nav.classList.contains("open")) return;
    if (!e.target.closest("#navMenu") && !e.target.closest("#menuToggle")) {
      nav.classList.remove("open");
    }
  });

  searchInput.addEventListener("input", function () {
    keyword = this.value.trim().toLowerCase();
    render();
  });

  document.getElementById("lucky").addEventListener("click", function () {
    var g = games[Math.floor(Math.random() * games.length)];
    location.href = "g/" + g.id + ".html";
  });

  // 从 URL hash 恢复分类（#cat=xxx），让从游戏页返回后仍停留在原分类
  var hm = /#cat=([^&]+)/.exec(location.hash);
  if (hm) {
    var restored = decodeURIComponent(hm[1]);
    var navVals = Array.prototype.map.call(document.querySelectorAll(".nav-item"), function (el) { return el.dataset.nav; });
    if (navVals.indexOf(restored) > -1) activeCat = restored;
  }

  renderNav();
  render();
})();
</script>
</body>
</html>
