<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>召唤神龙 · 双版本</title>
    <style>
        /* 极简 · 双龙 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Helvetica Neue', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #0a1a2a 0%, #1f3a5c 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        /* 淡淡龙鳞 */
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" opacity="0.06"><path fill="%23e6b422" d="M30 10 L35 25 L50 25 L38 35 L43 50 L30 40 L17 50 L22 35 L10 25 L25 25 Z"/></svg>');
            background-repeat: repeat;
            background-size: 80px 80px;
            pointer-events: none;
            z-index: 0;
        }

        .card {
            position: relative;
            z-index: 10;
            max-width: 500px;
            width: 100%;
            background: rgba(0, 8, 18, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(230, 180, 40, 0.3);
            border-radius: 48px;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7);
            padding: 40px 24px 40px;
            text-align: center;
        }

        /* 龙徽 */
        .dragon-badge {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }

        .dragon-icon {
            width: 80px;
            height: 80px;
            background: radial-gradient(circle at 30% 30%, #f8cb66, #b46504);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 12px rgba(0,0,0,0.6), 0 0 0 3px #f1c40f;
            font-size: 48px;
            line-height: 1;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #ffde9e;
            text-shadow: 0 3px 0 #8b5e1c, 0 6px 12px black;
            letter-spacing: 4px;
            margin: 8px 0 28px;
        }

        /* 双版本容器：并排，干净 */
        .version-row {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 10px 0 20px;
            flex-wrap: wrap;
        }

        .version-item {
            flex: 1 1 180px;
            max-width: 200px;
            background: rgba(0, 0, 0, 0.5);
 backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 200, 0, 0.35);
            border-radius: 36px;
            padding: 30px 0 26px;
            text-align: center;
            transition: 0.2s;
            box-shadow: 0 15px 20px -8px black;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .version-item:hover {
            transform: translateY(-4px);
            border-color: #f7b731;
            background: rgba(20, 30, 45, 0.9);
            box-shadow: 0 20px 24px -10px black;
        }

        .version-emoji {
            font-size: 68px;
            line-height: 1;
            filter: drop-shadow(0 6px 6px black);
            margin-bottom: 8px;
        }

        .version-title {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 3px;
        }

        .normal-title {
            color: #9fc5ff;
            text-shadow: 0 2px 0 #00478a;
        }

        .wudi-title {
            color: #ffbe3f;
            text-shadow: 0 2px 0 #a35100;
        }

        /* 干净底部 — 只有版本名，没有多余链接 */
        .footer-simple {
            margin-top: 30px;
            color: #8fafcf;
            font-size: 0.9rem;
            border-top: 1px dashed rgba(230, 180, 40, 0.4);
            padding-top: 20px;
            display: flex;
            justify-content: center;
            gap: 32px;
        }

        .footer-simple span {
            color: #ffcf6e;
            font-weight: 500;
        }

        /* 手机适配 */
        @media (max-width: 480px) {
            .card {
                padding: 30px 16px;
            }
            h1 {
                font-size: 2.2rem;
                margin-bottom: 20px;
            }
            .version-item {
                min-width: 140px;
                padding: 24px 0 20px;
            }
            .version-emoji {
                font-size: 58px;
            }
            .version-title {
                font-size: 1.9rem;
            }
            .dragon-icon {
                width: 70px;
                height: 70px;
                font-size: 42px;
            }
        }
    </style>
</head>
<body>

<div class="card">
    <!-- 龙头标识 -->
    <div class="dragon-badge">
        <div class="dragon-icon">🐉</div>
    </div>

    <h1>召唤神龙</h1>

    <!-- 真正的两个版本：正常版 + 无敌版，没有第三个 -->
    <div class="version-row">
        <!-- 正常版 -->
        <a href="zhengchang" class="version-item">
            <div class="version-emoji">🐲</div>
            <div class="version-title normal-title">正常版</div>
        </a>
        <!-- 无敌版 -->
        <a href="wudi" class="version-item">
            <div class="version-emoji">⚡🐉</div>
            <div class="version-title wudi-title">无敌版</div>
        </a>
    </div>

    <!-- 底部只显示版本标识，无多余按钮/链接 -->
    <div class="footer-simple">
        <span>正常版</span>
        <span>无敌版</span>
    </div>
</div>

<!-- 干净收尾，只有两个入口 -->
</body>
</html>
