<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#bfeaff">
<meta name="description" content="竹知了 —— 一转就哇哇叫的传统玩具，Web 模拟版">
<link rel="icon" type="image/png" href="https://imga.yangtuoboke.com/imgbed/20260803/6a7039a2925f93.58908769.png">

<script

  data-vc-product-id="cmsap4sw000000ahz2kvrogxg"

></script>
<title>竹知了 · 一转就哇哇叫</title>
<style>
  :root{
    --ink:#3a7bd5;
    --paper:#fffaf0;
    --accent:#ff8a3d;
    --accent-dim:#f56a1f;
    --bamboo:#8bc34a;
    --serif:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{
    height:100%; overflow:hidden; background:#bfe9ff;
    overscroll-behavior:none;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  canvas#cv{
    position:fixed; inset:0; display:block;
    touch-action:none; cursor:grab;
  }
  canvas#cv.holding{ cursor:grabbing; }

  /* —— 竖排标题 —— */
  .masthead{
    position:fixed;
    top:calc(26px + env(safe-area-inset-top));
    left:calc(20px + env(safe-area-inset-left));
    display:flex; gap:14px; pointer-events:none;
    color:#2b4a6f; font-family:var(--serif);
  }
  .masthead h1{
    writing-mode:vertical-rl;
    font-size:clamp(42px, 7.5vh, 66px);
    font-weight:900; letter-spacing:.32em;
    color:#ff5e3a;
    text-shadow:2px 2px 0 #fff, 4px 4px 0 rgba(255,140,60,.25);
  }
  .masthead .sub{
    writing-mode:vertical-rl;
    font-size:clamp(12px, 1.8vh, 15px);
    letter-spacing:.5em; opacity:.85; padding-top:10px;
    color:#3a6ea5;
  }
  .masthead .seal{
    writing-mode:vertical-rl;
    align-self:flex-start;
    font-size:11px; letter-spacing:.28em;
    color:#fff; background:#ff8a3d;
    padding:8px 3px; border-radius:8px; opacity:.95;
    box-shadow:0 3px 0 rgba(245,106,31,.5);
  }

  /* —— 底部提示 —— */
  .hint{
    position:fixed; left:50%; bottom:calc(9vh + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    display:flex; align-items:center; gap:12px;
    padding:11px 24px; border-radius:999px;
    color:#3a4a2a; font-family:var(--serif);
    font-size:15px; letter-spacing:.22em; white-space:nowrap;
    background:rgba(255,255,255,.82);
    border:2px solid rgba(255,138,61,.55);
    box-shadow:0 6px 18px rgba(120,170,220,.35);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    pointer-events:none;
    animation:bob 3.2s ease-in-out infinite;
    transition:opacity 1.2s ease;
  }
  .hint .snd{ font-size:12px; opacity:.7; letter-spacing:.1em; color:#ff7a2d; }
  .hint svg{ flex:none; opacity:.95; animation:spin 2.6s linear infinite; }
  .hint.gone{ opacity:0; }
  @keyframes bob{ 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(-7px)} }
  @keyframes spin{ to{ transform:rotate(360deg);} }

  /* —— 右下控制 —— */
  .panel{
    position:fixed; right:calc(18px + env(safe-area-inset-right));
    bottom:calc(18px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; align-items:flex-end; gap:12px;
    font-family:var(--serif); color:#2b4a6f;
  }
  .meter{ text-align:right; line-height:1.15; }
  .meter b{
    font-size:30px; font-weight:900; font-variant-numeric:tabular-nums;
    color:#ff7a2d; text-shadow:1px 1px 0 #fff;
  }
  .meter label{ display:block; font-size:11px; letter-spacing:.32em; opacity:.7; }
  .panel button{
    font-family:var(--serif); font-size:14px; letter-spacing:.3em; font-weight:700;
    padding:10px 18px 10px 22px; border-radius:999px;
    color:#fff; background:#ff8a3d;
    border:2px solid #ffae6b;
    box-shadow:0 4px 0 #e86f22, 0 6px 14px rgba(255,138,61,.35);
    cursor:pointer; transition:all .25s ease;
    touch-action:manipulation;
  }
  .panel button:active{ transform:translateY(3px); box-shadow:0 1px 0 #e86f22; }
  .panel button:hover{ background:#ff9a55; }
  .panel button.on{
    background:#5fb85f; border-color:#8fd98f; color:#fff;
    box-shadow:0 4px 0 #3f9a3f, 0 6px 14px rgba(95,184,95,.35);
  }

  /* —— 首次开声引导(仅触屏 & 音频未解锁时) —— */
  .unlock{
    position:fixed; left:50%; top:26%; transform:translateX(-50%);
    padding:12px 26px; border-radius:999px;
    font-family:var(--serif); font-size:15px; letter-spacing:.2em; font-weight:700;
    color:#fff; background:#ff8a3d;
    border:2px solid #ffce9e;
    box-shadow:0 5px 0 #e86f22, 0 8px 22px rgba(255,138,61,.45);
    cursor:pointer; z-index:5; white-space:nowrap;
    animation:pulse 1.8s ease-in-out infinite;
    transition:opacity .5s ease;
  }
  .unlock.gone{ opacity:0; pointer-events:none; }
  @keyframes pulse{
    0%,100%{ transform:translateX(-50%) scale(1); }
    50%{ transform:translateX(-50%) scale(1.06); }
  }

  /* —— 关于 角标按钮 —— */
  .ghlink{
    position:fixed;
    top:calc(24px + env(safe-area-inset-top));
    right:calc(20px + env(safe-area-inset-right));
    font-family:var(--serif); font-size:13px; letter-spacing:.18em; font-weight:700;
    color:#fff; opacity:.95; text-decoration:none; cursor:pointer;
    border:2px solid #ffce9e; border-radius:999px;
    background:#ff8a3d;
    box-shadow:0 3px 0 #e86f22, 0 5px 12px rgba(255,138,61,.35);
    padding:6px 16px 6px 16px;
    transition:all .2s ease;
  }
  .ghlink:active{ transform:translateY(2px); box-shadow:0 1px 0 #e86f22; }
  .ghlink:hover{ background:#ff9a55; }

  /* —— 关于弹窗 —— */
  .modal-mask{
    position:fixed; inset:0; z-index:20;
    display:flex; align-items:center; justify-content:center;
    background:rgba(40,70,110,.45);
    backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
    opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .modal-mask.show{ opacity:1; pointer-events:auto; }
  .about-modal{
    width:min(86vw, 360px);
    background:linear-gradient(180deg,#fffaf0,#fff);
    border:3px solid #ffce9e; border-radius:22px;
    box-shadow:0 12px 40px rgba(120,90,40,.3);
    padding:24px 22px 20px; text-align:center;
    font-family:var(--serif); color:#3a4a2a;
    transform:translateY(16px) scale(.96); transition:transform .25s ease;
  }
  .modal-mask.show .about-modal{ transform:translateY(0) scale(1); }
  .about-modal h2{
    margin:0 0 6px; font-size:22px; font-weight:900; letter-spacing:.1em;
    color:#ff7a2d;
  }
  .about-modal .desc{ font-size:13px; opacity:.8; margin-bottom:16px; line-height:1.7; }
  .about-modal .qr{
    width:160px; height:160px; object-fit:cover; border-radius:14px;
    border:3px solid #ffd9a8; box-shadow:0 4px 14px rgba(255,138,61,.3);
    display:block; margin:0 auto 8px;
  }
  .about-modal .name{
    display:inline-flex; align-items:center; gap:8px;
    margin-top:6px; padding:8px 14px; border-radius:999px;
    background:#fff3e0; border:2px solid #ffce9e;
    font-size:15px; font-weight:700; color:#ff7a2d; letter-spacing:.06em;
    cursor:pointer; user-select:none; transition:all .2s ease;
  }
  .about-modal .name:active{ transform:scale(.96); }
  .about-modal .name .cp{ font-size:12px; opacity:.7; font-weight:700; }
  .about-modal .close{
    position:absolute; top:-14px; right:-14px;
    width:34px; height:34px; border-radius:50%;
    background:#ff8a3d; color:#fff; border:3px solid #fff;
    font-size:18px; line-height:1; cursor:pointer;
    box-shadow:0 3px 10px rgba(255,138,61,.45);
    display:flex; align-items:center; justify-content:center;
  }
  .about-modal .toast{
    font-size:12px; color:#3f9a3f; font-weight:700; height:16px; margin-top:6px;
    opacity:0; transition:opacity .2s ease;
  }
  .about-modal .toast.show{ opacity:1; }

  /* 关于弹窗 - 样式1富文本 */
  .about-modal .about-richtext{ font-size:14px; line-height:1.8; text-align:left; padding:0 4px; }
  .about-modal .about-richtext img{ max-width:100%; border-radius:10px; margin:8px 0; }
  /* 样式2文字+图片 */
  .about-modal .about-text{ font-size:14px; line-height:1.8; margin-bottom:12px; }
  .about-modal .about-image{ max-width:180px; border-radius:12px; display:block; margin:0 auto 10px; }
  .about-modal .about-copy-btn{
    display:inline-flex; align-items:center; gap:6px;
    margin-top:6px; padding:8px 16px; border-radius:999px;
    background:#fff3e0; border:2px solid #ffce9e;
    font-size:13px; font-weight:700; color:#ff7a2d; cursor:pointer;
    transition:all .2s ease; user-select:none;
  }
  .about-modal .about-copy-btn:active{ transform:scale(.96); }
  /* 样式3 QQ群 */
  .about-modal .about-qq-btn{
    display:inline-flex; align-items:center; gap:8px;
    margin:10px 0; padding:12px 28px; border-radius:999px;
    background:#12b7f5; color:#fff;
    font-size:16px; font-weight:700; letter-spacing:.08em;
    text-decoration:none; cursor:pointer;
    box-shadow:0 4px 0 #0d9ed8, 0 6px 14px rgba(18,183,245,.4);
    transition:all .2s ease;
  }
  .about-modal .about-qq-btn:active{ transform:translateY(2px); box-shadow:0 2px 0 #0d9ed8; }
  .about-modal .about-qq-btn:hover{ background:#22c7ff; }
  .about-modal .about-divider{ border:none; border-top:1px dashed #ffce9e; margin:16px 0 10px; }

  /* —— 皮肤选择弹窗 —— */
  .skin-modal{
    position:fixed; inset:0; z-index:22;
    display:flex; align-items:center; justify-content:center;
    background:rgba(40,70,110,.45);
    backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
    opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .skin-modal.show{ opacity:1; pointer-events:auto; }
  .skin-box{
    width:min(90vw, 380px); position:relative;
    background:linear-gradient(180deg,#fffaf0,#fff);
    border:3px solid #ffce9e; border-radius:22px;
    box-shadow:0 12px 40px rgba(120,90,40,.3);
    padding:22px 18px 18px; text-align:center;
    font-family:var(--serif); color:#3a4a2a;
    transform:translateY(16px) scale(.96); transition:transform .25s ease;
  }
  .skin-modal.show .skin-box{ transform:translateY(0) scale(1); }
  .skin-box h3{ font-size:18px; font-weight:900; margin-bottom:14px; color:#ff7a2d; letter-spacing:.1em; }
  .skin-list{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:12px; }
  .skin-card{
    width:90px; padding:10px 6px; border-radius:14px; cursor:pointer;
    border:2.5px solid transparent; background:#fdf8f0;
    transition:all .2s ease; font-size:12px; letter-spacing:.06em;
    touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  }
  .skin-card:hover{ transform:translateY(-2px); box-shadow:0 4px 12px rgba(120,90,40,.2); }
  .skin-card:active{ transform:scale(.96); }
  .skin-card.active{ border-color:#ff8a3d; background:#fff3e0; box-shadow:0 4px 12px rgba(255,138,61,.25); }
  .skin-card .swatch{ width:44px; height:44px; border-radius:10px; margin:0 auto 6px; display:flex; align-items:center; justify-content:center; font-size:22px; }
  .skin-card .sname{ font-weight:700; font-size:12px; color:#3a4a2a; }
  .skin-divider{ border:none; border-top:1px dashed #ffce9e; margin:14px 0 8px; }
  .scene-list{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:12px; }
  .scene-card{
    width:86px; padding:10px 6px 8px; border-radius:14px;
    border:2px solid #f0e0c0; background:#fffbf0;
    cursor:pointer; transition:all .2s ease; text-align:center;
    touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  }
  .scene-card:hover{ border-color:#ffce9e; background:#fff6e0; }
  .scene-card:active{ transform:scale(.96); }
  .scene-card.active{ border-color:#ff8a3d; background:#fff2e0; box-shadow:0 2px 8px rgba(255,138,61,.25); }
  .scene-card .swatch{ width:38px; height:38px; border-radius:10px; margin:0 auto 5px; display:flex; align-items:center; justify-content:center; font-size:20px; }
  .scene-card .sname{ font-weight:700; font-size:11px; color:#3a4a2a; }
  .skin-reset{
    font-family:var(--serif); font-size:12px; letter-spacing:.16em; font-weight:700;
    padding:7px 16px; border-radius:999px; cursor:pointer;
    color:#ff8a3d; background:transparent; border:2px solid #ffce9e;
    transition:all .2s ease;
  }
  .skin-reset:hover{ background:#fff3e0; }
  .skin-reset:active{ transform:scale(.96); }
  .skin-close-btn{
    position:absolute; top:-14px; right:-14px;
    width:34px; height:34px; border-radius:50%;
    background:#ff8a3d; color:#fff; border:3px solid #fff;
    font-size:18px; line-height:1; cursor:pointer;
    box-shadow:0 3px 10px rgba(255,138,61,.45);
    display:flex; align-items:center; justify-content:center;
  }
  /* 皮肤设置按钮 */
  .skinbtn{
    font-family:var(--serif); font-size:13px; letter-spacing:.2em; font-weight:700;
    padding:8px 14px 8px 16px; border-radius:999px;
    color:#fff; background:#5fb85f;
    border:2px solid #8fd98f;
    box-shadow:0 3px 0 #3f9a3f, 0 5px 12px rgba(95,184,95,.35);
    cursor:pointer; transition:all .25s ease;
    touch-action:manipulation;
  }
  .skinbtn:active{ transform:translateY(2px); box-shadow:0 1px 0 #3f9a3f; }
  .skinbtn:hover{ background:#6cc46c; }

  /* —— 底部统计行 —— */
  .stats{
    position:fixed; left:50%; bottom:calc(8px + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    font-family:var(--serif); font-size:11px; letter-spacing:.14em;
    color:#3a5a7a; opacity:.8; white-space:nowrap;
    pointer-events:none;
  }
  .stats b{ font-weight:900; color:#ff7a2d; font-variant-numeric:tabular-nums; }
  .stats b.wahflash{ animation:wahflash .5s ease; }
  @keyframes wahflash{ 0%{ color:#ff8a50; text-shadow:0 0 12px rgba(255,138,80,.8); } 100%{} }

  /* —— 左下站点链接 —— */
  .sitelink{
    position:fixed;
    left:calc(22px + env(safe-area-inset-left));
    bottom:calc(78px + env(safe-area-inset-bottom));
    z-index:4;
    font-family:var(--serif); font-size:13px; letter-spacing:.06em; font-weight:700;
    color:#fff; text-decoration:none;
    background:#5fb85f; border:2px solid #a8e0a8;
    padding:5px 14px; border-radius:999px;
    box-shadow:0 3px 0 #3f9a3f, 0 5px 14px rgba(95,184,95,.35);
    transition:all .2s ease;
  }
  .sitelink:hover{ background:#6cc46c; transform:translateY(-1px); }
  .sitelink:active{ transform:translateY(2px); box-shadow:0 1px 0 #3f9a3f; }

  /* —— 左下注脚 —— */
  .lore{
    position:fixed;
    left:calc(22px + env(safe-area-inset-left));
    bottom:calc(22px + env(safe-area-inset-bottom));
    pointer-events:none;
    font-family:var(--serif); font-size:11.5px; letter-spacing:.24em;
    color:#3a5a7a; opacity:.7; line-height:2;
  }

  /* —— 底部免责声明 —— */
  .disclaimer{
    display:block; text-align:center;
    font-family:var(--serif); font-size:10px; letter-spacing:.08em;
    color:#3a5a7a; opacity:.45;
  }

  @media (max-width:640px){
    .lore{ display:none; }
    .disclaimer{ font-size:9px; }

    /* 标题改横排，省下左侧竖向空间 */
    .masthead{
      top:calc(14px + env(safe-area-inset-top));
      left:calc(12px + env(safe-area-inset-left));
      gap:8px;
    }
    .masthead h1{
      writing-mode:horizontal-tb;
      font-size:clamp(26px, 7vw, 38px);
      letter-spacing:.12em;
      text-shadow:1.5px 1.5px 0 #fff, 3px 3px 0 rgba(255,140,60,.22);
    }
    .masthead .sub{
      writing-mode:horizontal-tb;
      font-size:11px; letter-spacing:.32em; padding-top:0;
      align-self:center;
    }
    .masthead .seal{ display:none; }

    /* 关于按钮紧凑化 */
    .ghlink{ font-size:12px; padding:5px 13px; top:calc(14px + env(safe-area-inset-top)); right:calc(12px + env(safe-area-inset-right)); }

    /* 网址链接：贴左下，避开统计行 */
    .sitelink{ font-size:11px; padding:4px 11px; bottom:calc(74px + env(safe-area-inset-bottom)); }

    /* 统计行：允许换行，宽度自动避开右侧面板 */
    .stats{
      left:calc(12px + env(safe-area-inset-left));
      transform:none;
      bottom:calc(12px + env(safe-area-inset-bottom));
      max-width:calc(100vw - 126px); white-space:normal;
      font-size:10px; letter-spacing:.06em; line-height:1.6;
    }

    /* 提示气泡上移到统计行上方，避免重叠 */
    .hint{
      font-size:12px; letter-spacing:.1em; padding:9px 16px;
      bottom:calc(104px + env(safe-area-inset-bottom));
      max-width:88vw;
    }
    .hint .snd{ display:none; }

    /* 右下控制面板缩小 */
    .panel{
      right:calc(10px + env(safe-area-inset-right));
      bottom:calc(10px + env(safe-area-inset-bottom));
      gap:6px;
    }
    .panel .meter b{ font-size:20px; }
    .panel .meter label{ font-size:8px; letter-spacing:.18em; }
    .panel button{ font-size:11px; padding:7px 12px; letter-spacing:.1em; }

    /* 统计行：进一步放宽宽度并压缩字距，允许换行 */
    .stats{
      left:calc(10px + env(safe-area-inset-left));
      bottom:calc(10px + env(safe-area-inset-bottom));
      max-width:calc(100vw - 156px);
      font-size:9.5px; letter-spacing:0; white-space:normal; line-height:1.6;
    }
  }

  /* 更小屏（矮屏手机横握/小屏）进一步收紧 */
  @media (max-width:380px){
    .masthead .sub{ display:none; }
    .stats{ max-width:calc(100vw - 144px); font-size:9px; white-space:normal; line-height:1.5; }
    .hint{ bottom:calc(96px + env(safe-area-inset-bottom)); }
    .panel button{ font-size:10px; padding:6px 10px; }
  }
  @media (prefers-reduced-motion:reduce){
    .hint, .hint svg{ animation:none; }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<header class="masthead">
  <h1>竹知了</h1>
  <p class="sub">一转，就哇哇地叫</p>
  <span class="seal">儿时玩物</span>
</header>

<div class="hint" id="hint">
  <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
    <path d="M10 2.5 A7.5 7.5 0 1 1 3.2 6.6" stroke="#ff8a3d" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M2.6 2.8 L3.2 6.8 L7.1 5.6" stroke="#ff8a3d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </svg>
  按住 · 画圈 · 甩起来
  <span class="snd">🔊 有声音</span>
</div>

<div class="panel">
  <div class="meter"><b id="rps">0.0</b><label>圈 / 秒</label></div>
  <button class="skinbtn" id="skinBtn">皮肤</button>
  <button id="motionBtn" style="display:none">甩手机</button>
  <button id="autoBtn">自动甩</button>
</div>

<div class="skin-modal" id="skinMask">
  <div class="skin-box" role="dialog" aria-modal="true">
    <div class="skin-close-btn" id="skinClose">×</div>
    <h3>选择知了皮肤</h3>
    <div class="skin-list" id="skinList">
      <div class="skin-card active" data-skin="bamboo">
        <div class="swatch" style="background:linear-gradient(135deg,#8bc34a,#7cb342)">🎋</div>
        <div class="sname">竹知了</div>
      </div>
      <div class="skin-card" data-skin="ggbond">
        <div class="swatch" style="background:linear-gradient(135deg,#f48fb1,#ec407a)">🐷</div>
        <div class="sname">猪猪侠</div>
      </div>
      <div class="skin-card" data-skin="spiderman">
        <div class="swatch" style="background:linear-gradient(135deg,#d32f2f,#1976d2)">🕷️</div>
        <div class="sname">蜘蛛侠</div>
      </div>

<script>
'use strict';
/* ============================================================
   竹知了 —— 传统玩具模拟
   物理：甩杆(指针) → 绳系竹筒(质点, 重力+弹性绳+阻力)
   声学：首选真实竹知了录音采样(转速驱动回放速率)；
         解码失败回退合成链(锯齿波→调幅→扫频带通→共振峰)
   ============================================================ */

// roundRect 需 Safari 16+/Chrome 99+，旧内核补一个 arcTo 实现避免整页崩掉
if(!('roundRect' in CanvasRenderingContext2D.prototype)){
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r){
    r = Math.min(Math.abs(+r) || 0, w/2, h/2);
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
    return this;
  };
}
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const FONT = '"Songti SC","Noto Serif SC","Noto Serif CJK SC","STSong","SimSun",serif';

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;

/* ---------- 玩具参数 ---------- */
let ROPE_LEN = 150;       // 绳长 px（随屏幕尺寸调整）
let AUTO_R   = 58;        // 自动甩画圈半径（随屏幕尺寸调整）
const ROPE_K   = 2600;    // 绳弹性 (加速度/px)
const ROPE_D   = 14;      // 绳径向阻尼
const GRAV     = 1150;    // 重力 px/s^2
const AIR_DRAG = 0.35;    // 空气阻力系数

/* ---------- 状态 ---------- */
const stick  = { x: 0, y: 0 };            // 甩杆杆梢
const target = { x: 0, y: 0 };            // 指针目标
const tube   = { x: 0, y: 0, vx: 0, vy: 0 }; // 竹筒(质点)
const pointer = { down: false, id: null, lift: 0 };  // lift: 触摸时锚点上移量
const auto = { on: false, rps: 0, phase: 0, cx: 0, cy: 0 };
let interacted = false;                   // 玩家是否已上手

function recenterToy(){
  target.x = stick.x = W*0.5;
  target.y = stick.y = H*0.42;
  tube.x = stick.x + 8;
  tube.y = stick.y + ROPE_LEN*0.92;
  tube.vx = 34; tube.vy = 0;
  prevTheta = Math.atan2(tube.y - stick.y, tube.x - stick.x);
}

let theta = 0, prevTheta = 0, omega = 0;  // 绳方向角与角速度
let ropeDist = ROPE_LEN, taut = 0;
let rps = 0, drive = 0, active = 0;       // 声音驱动量 0~1
let singTime = 0, hintGone = false;
let idleTime = 0;                         // 完全静置的累计时长
let revAccum = 0;                         // 手动甩的角度累计(每 2π 记一哇)
let needSoundTime = 0;                    // "想出声却出不了"的持续时长

/* ---------- 场景缓存(随 resize 重建为离屏层，避免每帧全屏静态重绘) ---------- */
let bgLayer = null, moonBambooLayer = null, fgLayer = null;
let stars = [], flies = [];
let grainTile = null;
let stickGrad = null, tubeGrad = null;    // 玩具渐变(局部坐标恒定，只建一次)
let currentScene = 'day';                 // 当前场景: day | noon | night

/* ---------- 皮肤主题 ---------- */
const SKINS = {
  bamboo: {
    name:'竹知了', emoji:'🎋',
    tubeColors:['#8bc34a','#c5e89a','#aed581','#7cb342'], tubeStroke:'#4e7a23',
    headband:'#ff5e3a', headbandStroke:'#c43a1c',
    membrane:'#fff7df', membraneGlow:'#ffd27a', membraneGlowFill:'#fff1bf',
    ropeColor:'rgba(255,94,58,0.95)',
    stickColors:['#e2cd9a','#a8894f'],
    beadColor:'#c23324', beadHighlight:'rgba(255,200,180,0.55)',
    wingFill:'rgba(255,251,224,0.92)', wingStroke:'rgba(120,170,70,0.65)', wingVein:'rgba(120,170,70,0.5)',
    eyeBg:'#fff', eyePupil:'#2b2b2b', eyeHighlight:'rgba(255,255,255,0.95)',
    tailFill:'#4c3d24', tailStroke:'rgba(234,223,184,0.6)',
    knotColor:'#ff5e3a',
    trailColor:'#ffb74d', rippleColor:'#ff8a3d', cryStroke:'#ff5e3a', cryFill:'#fff2a8',
    special:null
  },
  ggbond: {
    name:'猪猪侠', emoji:'🐷',
    tubeColors:['#f48fb1','#fce4ec','#f8bbd0','#ec407a'], tubeStroke:'#c2185b',
    headband:'#ffd54f', headbandStroke:'#f9a825',
    membrane:'#fff9c4', membraneGlow:'#ffe082', membraneGlowFill:'#ffecb3',
    ropeColor:'rgba(255,110,180,0.95)',
    stickColors:['#ffe0b2','#ffb74d'],
    beadColor:'#e91e63', beadHighlight:'rgba(255,220,220,0.55)',
    wingFill:'rgba(255,240,245,0.92)', wingStroke:'rgba(240,150,170,0.65)', wingVein:'rgba(240,150,170,0.5)',
    eyeBg:'#fff', eyePupil:'#4a148c', eyeHighlight:'rgba(255,255,255,0.95)',
    tailFill:'#880e4f', tailStroke:'rgba(255,180,200,0.6)',
    knotColor:'#ffd54f',
    trailColor:'#f48fb1', rippleColor:'#f06292', cryStroke:'#e91e63', cryFill:'#fff9c4',
    special:'ggbond'
  },
  spiderman: {
    name:'蜘蛛侠', emoji:'🕷️',
    tubeColors:['#d32f2f','#ff5252','#e53935','#1976d2'], tubeStroke:'#0d47a1',
    headband:'#d32f2f', headbandStroke:'#b71c1c',
    membrane:'#e3f2fd', membraneGlow:'#90caf9', membraneGlowFill:'#bbdefb',
    ropeColor:'rgba(211,47,47,0.95)',
    stickColors:['#90caf9','#1976d2'],
    beadColor:'#0d47a1', beadHighlight:'rgba(200,220,255,0.55)',
    wingFill:'rgba(255,235,238,0.92)', wingStroke:'rgba(211,47,47,0.65)', wingVein:'rgba(211,47,47,0.5)',
    eyeBg:'#fff', eyePupil:'#b71c1c', eyeHighlight:'rgba(255,255,255,0.95)',
    tailFill:'#0d47a1', tailStroke:'rgba(200,220,255,0.6)',
    knotColor:'#d32f2f',
    trailColor:'#ef9a9a', rippleColor:'#d32f2f', cryStroke:'#d32f2f', cryFill:'#e3f2fd',
    special:'spiderman'
  }
};
let currentSkin = 'bamboo';
function setSkin(id){
  if(!SKINS[id]) return;
  currentSkin = id;
  stickGrad = null; tubeGrad = null; // 强制重建渐变
  try{ localStorage.setItem('zzl_skin', id); }catch(_){}
  // 更新卡片选中态
  document.querySelectorAll('.skin-card').forEach(c => c.classList.toggle('active', c.dataset.skin === id));
}
function resetSkin(){ setSkin('bamboo'); }

function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  // 某些 webview 布局前会短暂报 0，兜底成 1 避免 0 尺寸画布抛异常
  W = Math.max(1, window.innerWidth); H = Math.max(1, window.innerHeight);
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // 移动端优先：小屏上绳更短、圈更小，拇指画小圈就能甩起来，
  // 且自动甩轨道(绳长+拉伸+圈半径)不出屏
  const minDim = Math.min(W, H);
  ROPE_LEN = clamp(minDim*0.28, 90, 150);
  AUTO_R   = clamp(minDim*0.13, 38, 58);

  // 玩家还没上手时，窗口变化就把玩具重新挂回屏幕中央
  if(!interacted) recenterToy();
  else { target.x = clamp(target.x, 0, W); target.y = clamp(target.y, 0, H); }

  // 旋屏/缩放后自动甩圆心重新钳制，避免玩具整体转出屏幕
  if(auto.on){
    auto.cx = clamp(auto.cx, W*0.28, W*0.72);
    auto.cy = clamp(auto.cy, H*0.26, H*0.6);
  }

  const rnd = mulberry32(2024);
  stars = [];
  for(let i = 0; i < 110; i++){
    stars.push({ x: rnd()*W, y: rnd()*H*0.72, r: 0.5 + rnd()*1.1,
                 a: 0.15 + rnd()*0.55, ph: rnd()*TAU, sp: 0.4 + rnd()*1.2 });
  }
  flies = [];
  for(let i = 0; i < 12; i++){
    flies.push({ x: rnd()*W, y: H*(0.45 + rnd()*0.5),
                 vx: (rnd()-0.5)*22, vy: (rnd()-0.5)*12,
                 ph: rnd()*TAU, sp: 0.8 + rnd()*1.4, r: 1.6 + rnd()*1.8 });
  }
  // 读取场景设置
  try{ const s = localStorage.getItem('zyl_scene'); if(s) currentScene = s; }catch(_){}
  buildBgLayer(currentScene);
  buildMoonBambooLayer(currentScene);
  buildFgLayer(currentScene);
}

function newLayer(){
  const c = document.createElement('canvas');
  c.width = W * DPR; c.height = H * DPR;
  const g = c.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  return [c, g];
}

/* 背景层：天空渐变 + 草地（根据场景切换） */
function buildBgLayer(scene){
  const [c, b] = newLayer();
  const sky = b.createLinearGradient(0, 0, 0, H);

  if(scene === 'night'){
    sky.addColorStop(0,    '#0d0d2b');
    sky.addColorStop(0.35, '#1a1a4e');
    sky.addColorStop(0.65, '#162447');
    sky.addColorStop(0.88, '#0f1f3d');
    sky.addColorStop(1,    '#0a0a1a');
  }else if(scene === 'noon'){
    sky.addColorStop(0,    '#4da8e0');
    sky.addColorStop(0.35, '#72c4f0');
    sky.addColorStop(0.70, '#e2f0c8');
    sky.addColorStop(1,    '#c0e890');
  }else{ // day
    sky.addColorStop(0,    '#9fe0ff');
    sky.addColorStop(0.45, '#bfeaff');
    sky.addColorStop(0.78, '#e8f7d8');
    sky.addColorStop(1,    '#cdf0a8');
  }
  b.fillStyle = sky; b.fillRect(0, 0, W, H);

  // 底部草地
  const gy = H*0.82;
  const grass1 = scene === 'night' ? '#1e3a2f' : scene === 'noon' ? '#94d055' : '#a8e063';
  const grass2 = scene === 'night' ? '#2d4a35' : scene === 'noon' ? '#b8e870' : '#bff07a';
  b.fillStyle = grass1;
  b.beginPath();
  b.moveTo(0, gy + 20);
  b.quadraticCurveTo(W*0.25, gy - 30, W*0.5, gy + 6);
  b.quadraticCurveTo(W*0.75, gy + 40, W, gy - 4);
  b.lineTo(W, H); b.lineTo(0, H); b.closePath(); b.fill();
  b.fillStyle = grass2;
  b.beginPath();
  b.moveTo(0, gy + 50);
  b.quadraticCurveTo(W*0.3, gy + 18, W*0.6, gy + 44);
  b.quadraticCurveTo(W*0.85, gy + 64, W, gy + 40);
  b.lineTo(W, H); b.lineTo(0, H); b.closePath(); b.fill();
  bgLayer = c;
}

/* 太阳/月亮层（根据场景切换） */
function buildMoonBambooLayer(scene){
  const [c, b] = newLayer();

  if(scene === 'night'){
    // === 夜：新月 + 星空 ===
    // 星星（随机散布）
    const rnd = mulberry32(2025);
    for(let i = 0; i < 80; i++){
      const sx2 = rnd()*W, sy2 = rnd()*H*0.65;
      const sr = 0.6 + rnd()*1.6;
      const alpha = 0.3 + rnd()*0.7;
      b.fillStyle = `rgba(255,255,${210+rnd()*45},${alpha})`;
      b.beginPath(); b.arc(sx2, sy2, sr, 0, TAU); b.fill();
    }
    // 新月
    const mx = W*0.78, my = H*0.15;
    b.fillStyle = '#ffe9b0';
    b.beginPath(); b.arc(mx, my, 30, 0, TAU); b.fill();
    b.fillStyle = currentScene === 'night' ? '#0d0d2b' : '#9fe0ff';
    // 用遮罩圆切出月牙
    b.globalCompositeOperation = 'destination-out';
    b.beginPath(); b.arc(mx + 12, my - 6, 28, 0, TAU); b.fill();
    b.globalCompositeOperation = 'source-over';
    // 月光辉
    const moonGlow = b.createRadialGradient(mx, my, 20, mx, my, 120);
    moonGlow.addColorStop(0, 'rgba(255,233,176,0.25)');
    moonGlow.addColorStop(1, 'rgba(255,233,176,0)');
    b.fillStyle = moonGlow;
    b.beginPath(); b.arc(mx, my, 120, 0, TAU); b.fill();

  }else{
    // === 白天 & 中午：卡通太阳 ===
    const sx = W*0.80, sy = scene === 'noon' ? H*0.10 : H*0.16;
    const sunSize = scene === 'noon' ? 40 : 34;
    const sunInner = scene === 'noon' ? 30 : 26;
    const spokeLen = scene === 'noon' ? 1.15 : 1;
    const sunColor = scene === 'noon' ? '#ffaa00' : '#ffd23f';
    const sunInnerColor = scene === 'noon' ? '#ffeda0' : '#fff3c4';
    const spokes = 12;
    b.strokeStyle = `rgba(255,${scene === 'noon' ? '160,40' : '200,72'},0.85)`;
    b.lineWidth = scene === 'noon' ? 6 : 5; b.lineCap = 'round';
    for(let i = 0; i < spokes; i++){
      const a = i/spokes*TAU;
      const r0 = 36*spokeLen, r1 = (56 + ((i % 2) ? 4 : 0))*spokeLen;
      b.beginPath();
      b.moveTo(sx + Math.cos(a)*r0, sy + Math.sin(a)*r0);
      b.lineTo(sx + Math.cos(a)*r1, sy + Math.sin(a)*r1);
      b.stroke();
    }
    b.fillStyle = sunColor;
    b.beginPath(); b.arc(sx, sy, sunSize, 0, TAU); b.fill();
    b.fillStyle = sunInnerColor;
    b.beginPath(); b.arc(sx, sy, sunInner, 0, TAU); b.fill();
    // 笑脸
    b.fillStyle = '#5a3d00';
    const ex = sunInner*0.32, ey = sunInner*0.15;
    b.beginPath(); b.arc(sx - ex, sy - ey, sunInner*0.12, 0, TAU); b.fill();
    b.beginPath(); b.arc(sx + ex, sy - ey, sunInner*0.12, 0, TAU); b.fill();
    b.strokeStyle = '#5a3d00'; b.lineWidth = 3; b.lineCap = 'round';
    b.beginPath(); b.arc(sx, sy + sunInner*0.15, sunInner*0.42, 0.18*Math.PI, 0.82*Math.PI); b.stroke();

    // 中午光线更强 → 额外光晕
    if(scene === 'noon'){
      const noonGlow = b.createRadialGradient(sx, sy, sunSize, sx, sy, 160);
      noonGlow.addColorStop(0, 'rgba(255,180,40,0.12)');
      noonGlow.addColorStop(1, 'rgba(255,180,40,0)');
      b.fillStyle = noonGlow;
      b.beginPath(); b.arc(sx, sy, 160, 0, TAU); b.fill();
    }

    // 白云
    function cloud(cx, cy, s){
      b.fillStyle = 'rgba(255,255,255,0.92)';
      const puff = (px, py, r) => { b.beginPath(); b.arc(px, py, r, 0, TAU); b.fill(); };
      puff(cx,       cy,       18*s);
      puff(cx + 16*s, cy + 4*s, 22*s);
      puff(cx + 38*s, cy,       16*s);
      puff(cx + 20*s, cy - 10*s, 16*s);
      b.fillStyle = 'rgba(225,245,255,0.92)';
      b.beginPath();
      b.ellipse(cx + 18*s, cy + 14*s, 30*s, 9*s, 0, 0, TAU);
      b.fill();
    }
    cloud(W*0.16, H*0.20, 1.1);
    if(W > 640){ cloud(W*0.55, H*0.12, 0.8); cloud(W*0.30, H*0.34, 0.6); }
  }
  moonBambooLayer = c;
}

/* 前景层（根据场景切换） */
function buildFgLayer(scene){
  const [c, b] = newLayer();
  if(scene === 'night'){
    // 夜间：暗角氛围
    const glow = b.createRadialGradient(W*0.5, H*0.4, Math.min(W,H)*0.2, W*0.5, H*0.5, Math.max(W,H)*0.9);
    glow.addColorStop(0, 'rgba(0,0,0,0.02)');
    glow.addColorStop(0.5, 'rgba(10,15,30,0.15)');
    glow.addColorStop(1, 'rgba(5,5,20,0.28)');
    b.fillStyle = glow; b.fillRect(0, 0, W, H);
  }else{
    // 白天/中午：明亮中心提亮
    const glow = b.createRadialGradient(W*0.5, H*0.4, Math.min(W,H)*0.2, W*0.5, H*0.5, Math.max(W,H)*0.9);
    glow.addColorStop(0, 'rgba(255,255,255,0.06)');
    glow.addColorStop(1, 'rgba(120,170,220,0.10)');
    b.fillStyle = glow; b.fillRect(0, 0, W, H);
  }
  fgLayer = c;
}

/* ============================================================
   声音 —— 首选真实竹知了录音采样，解码失败回退 Web Audio 合成

const RECORDED_RPS = 2.33;      // 录音里玩具的甩速(圈/秒)，由包络自相关测得
let AC = null, au = null;       // au.mode: null(加载中) | 'sample' | 'synth'

// 音频心跳：iOS 从后台切回后，上下文可能"状态 running 却无声"
// (currentTime 停走，输出管线已被系统回收)，这种僵尸只能拆掉重建
let acTimeLast = 0, acAdvanceWall = 0;
let acRebuilds = [];            // 最近自动重建时间戳：限频，防拆建循环
let sampleBytes = null;         // base64 只解一次，重建时复用
function audioStalled(){
  return !!AC && AC.state === 'running' && !document.hidden
      && acAdvanceWall > 0 && performance.now() - acAdvanceWall > 1500;
}

function ensureAudio(fromGesture){
  if(AC && (AC.state === 'closed' || audioStalled())){
    const now = performance.now();
    acRebuilds = acRebuilds.filter(ts => now - ts < 60000);
    if(!fromGesture && acRebuilds.length >= 3) return;   // 无手势自动重建 60s 限 3 次
    acRebuilds.push(now);
    try{ AC.close(); }catch(_){}
    AC = null; au = null;
    acTimeLast = 0; acAdvanceWall = 0;
  }
  if(AC){
    // 'suspended' 与 iOS 非标准的 'interrupted' 一并恢复
    if(AC.state !== 'running') AC.resume().catch(() => {});
    return;
  }
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if(!Ctx) return;
  AC = new Ctx();
  AC.resume().catch(() => {});
  acTimeLast = 0; acAdvanceWall = performance.now();

  // 公共输出链：总闸 → 压限 → 分析器 → 扬声器
  const master = AC.createGain(); master.gain.value = 0;
  const comp = AC.createDynamicsCompressor();
  comp.threshold.value = -18; comp.ratio.value = 8;
  comp.attack.value = 0.004; comp.release.value = 0.18;
  const analyser = AC.createAnalyser(); analyser.fftSize = 1024;
  master.connect(comp); comp.connect(analyser); analyser.connect(AC.destination);
  au = { master, analyser, mode: null };

  // 解码内嵌录音；任何一步失败都回退合成
  try{
    if(!sampleBytes){
      const bin = atob(ZZL_SAMPLE);
      sampleBytes = new Uint8Array(bin.length);
      for(let i = 0; i < bin.length; i++) sampleBytes[i] = bin.charCodeAt(i);
    }
    // decodeAudioData 会 detach 传入的 buffer，给副本以便重建时复用
    AC.decodeAudioData(sampleBytes.slice().buffer,
      buf => startSampleVoice(buf),
      () => startSynthVoice());
  }catch(_){ startSynthVoice(); }
}

/* 采样声部：把录音尾部 50ms 等功率交叉淡化烘进头部，做成无缝循环 */
function startSampleVoice(buf){
  if(!AC || !au || au.mode) return;
  const sr = buf.sampleRate;
  const F = Math.floor(sr*0.05);
  const loopLen = buf.length - F;
  if(loopLen <= sr*0.2){ startSynthVoice(); return; }
  const loop = AC.createBuffer(1, loopLen, sr);
  const s = buf.getChannelData(0), d = loop.getChannelData(0);
  d.set(s.subarray(0, loopLen));
  for(let i = 0; i < F; i++){
    const p = Math.PI/2 * i/F;
    d[i] = s[i]*Math.sin(p) + s[loopLen + i]*Math.cos(p);
  }
  const src = AC.createBufferSource();
  src.buffer = loop; src.loop = true;
  src.connect(au.master);
  src.start();
  au.sample = src;
  au.mode = 'sample';
}

/* 合成声部（兜底）：黏滑摩擦脉冲 → 调幅 → 扫频带通 → 膜腔共振峰 */
function startSynthVoice(){
  if(!AC || !au || au.mode) return;
  const t = AC.currentTime;

  const osc = AC.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.value = 70;
  const shaper = AC.createWaveShaper();
  {
    const n = 1024, curve = new Float32Array(n);
    for(let i = 0; i < n; i++){
      const x = i/(n - 1)*2 - 1;
      curve[i] = Math.tanh(x*3.2);
    }
    shaper.curve = curve;
    shaper.oversample = '2x';
  }
  osc.connect(shaper);

  const am = AC.createGain(); am.gain.value = 0.62;
  const lfo = AC.createOscillator();
  lfo.type = 'sine'; lfo.frequency.value = 30;
  const lfoAmt = AC.createGain(); lfoAmt.gain.value = 0.34;
  lfo.connect(lfoAmt); lfoAmt.connect(am.gain);
  shaper.connect(am);

  const nBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
  const nd = nBuf.getChannelData(0);
  for(let i = 0; i < nd.length; i++) nd[i] = Math.random()*2 - 1;
  const noise = AC.createBufferSource();
  noise.buffer = nBuf; noise.loop = true;
  const nFil = AC.createBiquadFilter();
  nFil.type = 'bandpass'; nFil.frequency.value = 2500; nFil.Q.value = 0.7;
  const nGain = AC.createGain(); nGain.gain.value = 0;
  noise.connect(nFil); nFil.connect(nGain);

  const bus = AC.createGain(); bus.gain.value = 0.9;
  am.connect(bus); nGain.connect(bus);
  const wah = AC.createBiquadFilter();
  wah.type = 'bandpass'; wah.frequency.value = 900; wah.Q.value = 2.2;
  bus.connect(wah);

  const sum = AC.createGain(); sum.gain.value = 1;
  const formant = (freq, q, g) => {
    const f = AC.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const fg = AC.createGain(); fg.gain.value = g;
    wah.connect(f); f.connect(fg); fg.connect(sum);
  };
  formant(1050, 9, 0.9);
  formant(2150, 11, 0.6);
  formant(3350, 13, 0.4);
  const bleed = AC.createGain(); bleed.gain.value = 0.07;
  wah.connect(bleed); bleed.connect(sum);

  const hp = AC.createBiquadFilter();
  hp.type = 'highpass'; hp.frequency.value = 360;
  sum.connect(hp); hp.connect(au.master);

  osc.start(t); lfo.start(t); noise.start(t);
  Object.assign(au, { osc, lfo, nGain, wah });
  au.mode = 'synth';
}

function updateAudio(){
  if(!AC || AC.state !== 'running' || !au || !au.mode) return;
  const t = AC.currentTime;
  // 总响度
  au.master.gain.setTargetAtTime(0.85*Math.pow(active, 1.3), t, 0.07);

  if(au.mode === 'sample'){
    // 甩得越快回放越快越高；再叠每圈相位的音高微摆(张力/多普勒感)
    const rate = clamp(Math.pow(rps/RECORDED_RPS, 0.7), 0.6, 1.5);
    au.sample.playbackRate.setTargetAtTime(active > 0.02 ? rate : 0.9, t, 0.09);
    au.sample.detune.setTargetAtTime(50*Math.sin(theta + 0.9)*clamp(active*1.6, 0, 1), t, 0.04);
    return;
  }

  // —— 合成兜底的参数 —— //
  const f0 = clamp(55 + rps*17, 50, 195);
  au.osc.frequency.setTargetAtTime(f0, t, 0.06);
  au.osc.detune.setTargetAtTime(46*Math.sin(theta + 0.9)*clamp(active*1.6, 0, 1), t, 0.03);
  au.lfo.frequency.setTargetAtTime(24 + rps*4.5, t, 0.1);
  const wf = 760 + 520*active + (430 + 330*active)*Math.sin(theta - 0.7);
  au.wah.frequency.setTargetAtTime(Math.max(320, wf), t, 0.025);
  au.nGain.gain.setTargetAtTime((0.03 + 0.17*active)*clamp(drive*4, 0, 1), t, 0.08);
}

/* ============================================================
   物理
   ============================================================ */
function physStep(h){
  const dx = tube.x - stick.x, dy = tube.y - stick.y;
  const d = Math.hypot(dx, dy) || 1e-6;
  const ux = dx/d, uy = dy/d;
  let ax = 0, ay = GRAV;
  if(d > ROPE_LEN){                       // 绳只拉不推
    const vrad = tube.vx*ux + tube.vy*uy;
    const f = -ROPE_K*(d - ROPE_LEN) - ROPE_D*vrad;
    ax += f*ux; ay += f*uy;
  }
  ax -= AIR_DRAG*tube.vx;
  ay -= AIR_DRAG*tube.vy;
  tube.vx += ax*h; tube.vy += ay*h;
  tube.x += tube.vx*h; tube.y += tube.vy*h;
}

function update(dt){
  // 甩杆目标：手动指针 / 自动画圈 / 甩手机体感
  if(auto.on){
    auto.rps += (3.4 - auto.rps)*Math.min(1, dt*1.1);
    auto.phase += auto.rps*TAU*dt;
    target.x = auto.cx + AUTO_R*Math.cos(auto.phase);
    target.y = auto.cy + AUTO_R*Math.sin(auto.phase);
  }else{
    auto.rps *= Math.max(0, 1 - dt*3);
    if(motion.on && !pointer.down){
      // 开了体感却收不到传感器事件(权限/环境问题)，2.5s 后自动退出并提示
      if(!motion.gotEvent && performance.now() - motion.enabledAt > 2500){
        setMotion(false);
        flashBtn(motionBtn, '不可用');
      }else{
        const cx = W*0.5, cy = H*0.42;
        const R = Math.min(W, H)*0.22;
        target.x = clamp(cx + motion.ax*16, cx - R, cx + R);
        target.y = clamp(cy - motion.ay*16, cy - R, cy + R);
      }
    }
  }
  const k = 1 - Math.exp(-dt*26);
  stick.x += (target.x - stick.x)*k;
  stick.y += (target.y - stick.y)*k;

  // 定步长积分
  let acc = dt;
  const h = 1/240;
  while(acc > 1e-6){ const s = Math.min(h, acc); physStep(s); acc -= s; }

  // 角速度(发声核心)：绳方向的转动快慢
  theta = Math.atan2(tube.y - stick.y, tube.x - stick.x);
  let dth = theta - prevTheta;
  while(dth >  Math.PI) dth -= TAU;
  while(dth < -Math.PI) dth += TAU;
  omega += (dth/dt - omega)*Math.min(1, dt*9);
  prevTheta = theta;
  rps = Math.abs(omega)/TAU;

  // 手动甩出的圈数计入「哇」——自动甩不算数
  if(!auto.on && active > 0.3){
    revAccum += Math.abs(dth);
    if(revAccum >= TAU){
      const n = Math.floor(revAccum/TAU);
      revAccum -= n*TAU;
      addWah(n);
    }
  }else{
    revAccum = 0;
  }

  ropeDist = Math.hypot(tube.x - stick.x, tube.y - stick.y);
  taut = clamp((ropeDist/ROPE_LEN - 0.88)/0.12, 0, 1);
  drive = clamp((rps - 1.1)/2.6, 0, 1);
  const tgt = Math.pow(drive, 1.25)*taut;
  active += (tgt - active)*Math.min(1, dt*(tgt > active ? 10 : 3.2));

  // 完全静置 8s 后挂起音频线程省电；任何交互的 ensureAudio 都会恢复
  if(active < 0.02 && rps < 0.15 && !pointer.down && !auto.on && !motion.on){
    idleTime += dt;
    if(idleTime > 8 && AC && AC.state === 'running') AC.suspend().catch(() => {});
  }else{
    idleTime = 0;
  }

  updateAudio();

  // 音频心跳采样：currentTime 停走 1.5s 即判僵尸，就地重建
  // (重建发生在无手势的帧循环里时，新上下文可能挂起，由解锁药丸引导恢复)
  if(AC && AC.state === 'running'){
    const ct = AC.currentTime;
    if(ct !== acTimeLast){
      acTimeLast = ct;
      acAdvanceWall = performance.now();
    }else if(audioStalled()){
      ensureAudio();
    }
  }else if(AC){
    // 非 running(静置挂起/来电中断等)期间宽限期持续顺延，
    // 恢复 running 的瞬间才不会把健康上下文误判成僵尸杀掉
    acAdvanceWall = performance.now();
  }

  // "想出声却出不了"：正在甩/自动/体感模式下上下文却没在跑 → 重新亮出解锁引导
  const wantSound = auto.on || motion.on || pointer.down || active > 0.05;
  if(wantSound && AC && AC.state !== 'running') needSoundTime += dt;
  else needSoundTime = 0;

  if(active > 0.3){
    singTime += dt;
    if(!hintGone && singTime > 1.0){
      hintGone = true;
      document.getElementById('hint').classList.add('gone');
    }
  }
  spawnFx(dt);
}

/* ============================================================
   视觉特效粒子
   ============================================================ */
const ripples = [];   // 声波涟漪
const cries = [];     // 飘出的「哇」
const trail = [];     // 竹筒运动轨迹
let rippleTimer = 0, cryTimer = 0;

function spawnFx(dt){
  trail.unshift({ x: tube.x, y: tube.y });
  if(trail.length > 16) trail.pop();

  rippleTimer -= dt; cryTimer -= dt;
  if(active > 0.15 && rippleTimer <= 0){
    rippleTimer = 0.09;
    ripples.push({ x: tube.x, y: tube.y, r: 16, age: 0, life: 0.7, str: active });
  }
  if(active > 0.3 && cryTimer <= 0 && cries.length < 36){
    cryTimer = 0.22;
    const ux = (tube.x - stick.x)/(ropeDist || 1);
    const uy = (tube.y - stick.y)/(ropeDist || 1);
    const sgn = omega >= 0 ? 1 : -1;
    // 切向飞出
    const tx = -uy*sgn, ty = ux*sgn;
    const sp = 90 + Math.random()*60;
    cries.push({
      x: tube.x + ux*14, y: tube.y + uy*14,
      vx: tx*sp + ux*30, vy: ty*sp + uy*30 - 20,
      age: 0, life: 1.1,
      size: 14 + 22*active,
      rot: (Math.random() - 0.5)*0.8
    });
  }
  for(let i = ripples.length - 1; i >= 0; i--){
    const p = ripples[i];
    p.age += dt; p.r += (200 + 160*p.str)*dt;
    if(p.age >= p.life) ripples.splice(i, 1);
  }
  for(let i = cries.length - 1; i >= 0; i--){
    const p = cries[i];
    p.age += dt;
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vx *= (1 - dt*1.2); p.vy = p.vy*(1 - dt*1.2) - 26*dt;
    if(p.age >= p.life) cries.splice(i, 1);
  }
}

/* ============================================================
   绘制
   ============================================================ */
function draw(now, dt){
  const sk = SKINS[currentSkin] || SKINS.bamboo;
  // 背景（天空+暖光，离屏层）
  if(bgLayer && bgLayer.width > 0) ctx.drawImage(bgLayer, 0, 0, W, H);

  // 月 + 竹影（离屏层，现为卡通太阳与白云）
  if(moonBambooLayer && moonBambooLayer.width > 0) ctx.drawImage(moonBambooLayer, 0, 0, W, H);

  // 漂浮元素（白天:气泡 / 中午:金色气泡 / 夜间:星星闪烁）
  if(currentScene === 'night'){
    for(const s of stars){
      const twinkle = 0.3 + 0.7*Math.sin(now*s.sp + s.ph);
      ctx.globalAlpha = s.a * twinkle;
      ctx.fillStyle = '#fffce8';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }else{
    for(const f of flies){
      f.x += f.vx*dt; f.y += f.vy*dt;
      if(f.x < -10) f.x = W + 10; if(f.x > W + 10) f.x = -10;
      if(f.y < H*0.25) f.vy = Math.abs(f.vy);
      if(f.y > H + 10) f.y = H*0.5;
      f.vx += Math.sin(now*0.7 + f.ph)*(18*dt);
      f.vy += Math.cos(now*0.9 + f.ph)*(12*dt);
      const glow = 0.5 + 0.5*Math.sin(now*f.sp + f.ph);
      ctx.globalAlpha = 0.35 + glow*0.4;
      ctx.fillStyle = currentScene === 'noon' ? 'rgba(255,240,210,0.9)' : 'rgba(255,255,255,0.9)';
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r || 2.2, 0, TAU); ctx.fill();
      ctx.globalAlpha = (0.35 + glow*0.4)*0.6;
      ctx.fillStyle = currentScene === 'noon' ? 'rgba(255,180,60,0.9)' : 'rgba(255,210,120,0.9)';
      ctx.beginPath(); ctx.arc(f.x - 0.6, f.y - 0.6, (f.r || 2.2)*0.4, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // 声波涟漪
  for(const p of ripples){
    const t = p.age/p.life;
    ctx.globalAlpha = (1 - t)*0.4*p.str;
    ctx.strokeStyle = sk.rippleColor; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // 运动残影
  const spNorm = clamp(rps/4, 0, 1);
  if(spNorm > 0.05 && trail.length > 2){
    ctx.fillStyle = sk.trailColor;
    for(let i = 1; i < trail.length; i++){
      const f = 1 - i/trail.length;
      ctx.globalAlpha = f*0.35*spNorm;
      ctx.beginPath();
      ctx.arc(trail[i].x, trail[i].y, 1.5 + 3.5*f, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  drawToy(now);

  // 飘出的「哇」（卡通糖果色 + 描边）
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for(const p of cries){
    const t = p.age/p.life;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot*t);
    ctx.globalAlpha = (1 - t)*(1 - t)*0.95;
    ctx.font = `900 ${(p.size*(1 + 0.5*t)).toFixed(1)}px ${FONT}`;
    ctx.lineWidth = 3.5;
    ctx.strokeStyle = sk.cryStroke;
    ctx.lineJoin = 'round';
    ctx.strokeText('哇', 0, 0);
    ctx.fillStyle = sk.cryFill;
    ctx.fillText('哇', 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // 暗角 + 颗粒（离屏层）
  if(fgLayer && fgLayer.width > 0) ctx.drawImage(fgLayer, 0, 0, W, H);
}

function drawToy(now){
  const sk = SKINS[currentSkin] || SKINS.bamboo;
  const dx = tube.x - stick.x, dy = tube.y - stick.y;
  const d = Math.hypot(dx, dy) || 1e-6;
  const ux = dx/d, uy = dy/d;

  // 绳
  ctx.strokeStyle = sk.ropeColor;
  ctx.lineWidth = 2.4;
  ctx.beginPath();
  ctx.moveTo(stick.x, stick.y);
  if(d < ROPE_LEN*0.97){
    const sag = (ROPE_LEN - d)*0.55;
    ctx.quadraticCurveTo((stick.x + tube.x)/2, (stick.y + tube.y)/2 + sag, tube.x, tube.y);
  }else{
    ctx.lineTo(tube.x, tube.y);
  }
  ctx.stroke();

  // 甩杆
  const sa = 1.15;
  const sdx = Math.cos(sa), sdy = Math.sin(sa);
  ctx.save();
  ctx.translate(stick.x, stick.y);
  if(!stickGrad){
    stickGrad = ctx.createLinearGradient(0, 0, sdx*88, sdy*88);
    stickGrad.addColorStop(0, sk.stickColors[0]); stickGrad.addColorStop(1, sk.stickColors[1]);
  }
  ctx.strokeStyle = stickGrad;
  ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(sdx*8, sdy*8);
  ctx.lineTo(sdx*88, sdy*88);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,240,200,0.35)';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(sdx*12 - sdy*1.4, sdy*12 + sdx*1.4);
  ctx.lineTo(sdx*76 - sdy*1.4, sdy*76 + sdx*1.4);
  ctx.stroke();
  // 珠子
  const bead = (bx, by, r) => {
    ctx.fillStyle = sk.beadColor;
    ctx.beginPath(); ctx.arc(bx, by, r, 0, TAU); ctx.fill();
    ctx.fillStyle = sk.beadHighlight;
    ctx.beginPath(); ctx.arc(bx - r*0.3, by - r*0.35, r*0.32, 0, TAU); ctx.fill();
  };
  bead(sdx*14, sdy*14, 4.6);
  bead(sdx*4,  sdy*4,  6);
  ctx.restore();

  // 竹筒
  ctx.save();
  ctx.translate(tube.x, tube.y);
  ctx.rotate(Math.atan2(uy, ux) - Math.PI/2);
  ctx.scale(1.35, 1.35);

  // 筒身
  if(!tubeGrad){
    tubeGrad = ctx.createLinearGradient(-12, 0, 12, 0);
    tubeGrad.addColorStop(0, sk.tubeColors[0]);
    tubeGrad.addColorStop(0.3, sk.tubeColors[1]);
    tubeGrad.addColorStop(0.62, sk.tubeColors[2]);
    tubeGrad.addColorStop(1, sk.tubeColors[3]);
  }
  ctx.fillStyle = tubeGrad;
  ctx.strokeStyle = sk.tubeStroke;
  ctx.lineWidth = 2.4;
  ctx.beginPath();
  ctx.roundRect(-12, 4, 24, 46, 8);
  ctx.fill();
  ctx.stroke();

  // 尾端开口
  ctx.fillStyle = sk.tailFill;
  ctx.beginPath(); ctx.ellipse(0, 49, 11, 4.2, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = sk.tailStroke; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.ellipse(0, 49, 11, 4.2, 0, 0.05, Math.PI - 0.05); ctx.stroke();

  // 蝉翼
  const spread  = 0.30 + active*0.38;
  const flutter = active*Math.sin(now*46)*0.22;
  const wing = side => {
    ctx.save();
    ctx.translate(side*9, 13);
    ctx.rotate(side*(spread + flutter));
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(side*13, 9, side*14, 30, side*5, 42);
    ctx.bezierCurveTo(side*-1, 33, side*-4, 12, 0, 0);
    ctx.fillStyle = sk.wingFill;
    ctx.fill();
    ctx.strokeStyle = sk.wingStroke;
    ctx.lineWidth = 1.4;
    ctx.stroke();
    // 翼脉
    ctx.strokeStyle = sk.wingVein; ctx.lineWidth = 0.9;
    if(sk.special === 'spiderman'){
      // 蜘蛛侠：蛛网状翼脉
      ctx.beginPath();
      ctx.moveTo(side*2, 4); ctx.quadraticCurveTo(side*9, 16, side*5, 38);
      ctx.moveTo(side*1, 6); ctx.quadraticCurveTo(side*4, 22, side*1.5, 34);
      ctx.moveTo(side*1, 0); ctx.quadraticCurveTo(side*6, 8,  side*1, 14);
      ctx.stroke();
    }else{
      ctx.beginPath();
      ctx.moveTo(side*2, 4);  ctx.quadraticCurveTo(side*9, 18, side*5, 38);
      ctx.moveTo(side*1, 6);  ctx.quadraticCurveTo(side*3, 20, side*1.5, 34);
      ctx.stroke();
    }
    ctx.restore();
  };
  wing(-1); wing(1);

  if(sk.special === 'spiderman'){
    // === 蜘蛛侠 Q版大圆头 ===
    ctx.fillStyle = '#e53935';
    ctx.strokeStyle = '#0d47a1';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 7, 14, 0, TAU); ctx.fill(); ctx.stroke();

    // 蛛网纹理
    ctx.strokeStyle = 'rgba(0,0,0,0.32)'; ctx.lineWidth = 0.85;
    ctx.beginPath();
    for(let i=0;i<8;i++){
      const a = (i/8)*TAU - Math.PI/2;
      ctx.moveTo(0, 7); ctx.lineTo(Math.cos(a)*13, 7+Math.sin(a)*13);
    }
    ctx.stroke();
    ctx.beginPath();
    for(let r=4;r<=11;r+=3.5){
      ctx.moveTo(0, 7-r); ctx.arc(0, 7, r, -Math.PI/2, Math.PI/2);
      ctx.moveTo(0, 7-r); ctx.arc(0, 7, r, -Math.PI/2, -Math.PI*1.5, true);
    }
    ctx.stroke();

    // 白色大眼（Q版）
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-6, 7, 5.8, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(6, 7, 5.8, 0, TAU); ctx.fill();

    // 红色鼻梁分隔 + 蓝色描边
    ctx.fillStyle = '#e53935';
    ctx.beginPath(); ctx.ellipse(0, 7, 2.2, 5.2, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#0d47a1'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.ellipse(0, 7, 2.2, 5.2, 0, 0, TAU); ctx.stroke();

    // 发声发光
    if(active > 0.05){
      ctx.globalAlpha = active*0.7;
      ctx.shadowColor = '#ff5252'; ctx.shadowBlur = 22*active;
      ctx.fillStyle = 'rgba(255,200,200,0.4)';
      ctx.beginPath(); ctx.arc(0, 7, 12, 0, TAU); ctx.fill();
      ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    }
  } else {
    // 头箍
    ctx.fillStyle = sk.headband;
    ctx.strokeStyle = sk.headbandStroke;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.roundRect(-12.5, 2, 25, 10, 5);
    ctx.fill(); ctx.stroke();

    // 膜面 + 发声透光
    ctx.fillStyle = sk.membrane;
    ctx.beginPath(); ctx.ellipse(0, 3, 10.5, 4.2, 0, 0, TAU); ctx.fill();
    if(active > 0.05){
      ctx.globalAlpha = active*0.85;
      ctx.shadowColor = sk.membraneGlow; ctx.shadowBlur = 18*active;
      ctx.fillStyle = sk.membraneGlowFill;
      ctx.beginPath(); ctx.ellipse(0, 3, 8.5, 3.4, 0, 0, TAU); ctx.fill();
      ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    }

    // 膜面特殊装饰
    if(sk.special === 'ggbond'){
      // 猪猪侠：粉色猪鼻子
      ctx.fillStyle = '#ff9eb5'; ctx.strokeStyle = '#e05780'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(0, 4, 5, 4, 0, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#d6336c';
      ctx.beginPath(); ctx.arc(-1.8, 3.8, 1, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(1.8, 3.8, 1, 0, TAU); ctx.fill();
    }
  }

  // 大眼睛
  if(sk.special === 'spiderman'){
    // 蜘蛛侠：Q版圆头内已绘制大眼
  }else if(sk.special === 'ggbond'){
    // 猪猪侠：更大更圆的可爱眼
    const pigEye = side => {
      ctx.fillStyle = sk.eyeBg;
      ctx.beginPath(); ctx.arc(side*8.5, 7.2, 4.2, 0, TAU); ctx.fill();
      ctx.fillStyle = sk.eyePupil;
      ctx.beginPath(); ctx.arc(side*8.5, 7.5, 2.5, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(side*8.5 - 0.9, 6.6, 1.2, 0, TAU); ctx.fill();
      // 星星高光
      ctx.fillStyle = sk.eyeHighlight;
      ctx.beginPath(); ctx.arc(side*8.5 + 1, 8.4, 0.7, 0, TAU); ctx.fill();
    };
    pigEye(-1); pigEye(1);
  }else{
    const eye = side => {
      ctx.fillStyle = sk.eyeBg;
      ctx.beginPath(); ctx.arc(side*8.5, 7.5, 3.4, 0, TAU); ctx.fill();
      ctx.fillStyle = sk.eyePupil;
      ctx.beginPath(); ctx.arc(side*8.5, 7.8, 2.1, 0, TAU); ctx.fill();
      ctx.fillStyle = sk.eyeHighlight;
      ctx.beginPath(); ctx.arc(side*8.5 - 0.8, 6.9, 0.9, 0, TAU); ctx.fill();
    };
    eye(-1); eye(1);
  }

  // 猪猪侠：猪耳朵
  if(sk.special === 'ggbond'){
    const pigEar = side => {
      ctx.fillStyle = '#f48fb1'; ctx.strokeStyle = '#c2185b'; ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(side*10, 5);
      ctx.quadraticCurveTo(side*15, -7, side*7, -8);
      ctx.quadraticCurveTo(side*4, -7, side*7, 4);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      // 耳内粉色
      ctx.fillStyle = '#fce4ec';
      ctx.beginPath();
      ctx.moveTo(side*8, 4);
      ctx.quadraticCurveTo(side*11, -4, side*7, -5);
      ctx.quadraticCurveTo(side*5, -4, side*7, 3);
      ctx.closePath(); ctx.fill();
    };
    pigEar(-1); pigEar(1);
  }

  // 膜心线结
  ctx.fillStyle = sk.knotColor;
  ctx.beginPath(); ctx.arc(0, 2, 2.2, 0, TAU); ctx.fill();

  ctx.restore();
}

/* ============================================================
   主循环 & 交互
   ============================================================ */
let last = performance.now();
let hudTimer = 0;
const rpsEl = document.getElementById('rps');
const autoBtn = document.getElementById('autoBtn');

function frame(now){
  // 有些嵌入环境不派发 resize 事件，每帧自查尺寸变化
  if(Math.max(1, window.innerWidth) !== W || Math.max(1, window.innerHeight) !== H) resize();
  // rAF 出现大间隙说明页面被冻结过(部分 WebView 不派发 visibilitychange)，宽限期重置
  if(now - last > 1000) acAdvanceWall = performance.now();
  const dt = Math.min(0.05, (now - last)/1000) || 0.016;
  last = now;
  update(dt);
  draw(now/1000, dt);
  hudTimer -= dt;
  if(hudTimer <= 0){
    hudTimer = 0.15;
    rpsEl.textContent = rps.toFixed(1);
    syncUnlock();
  }
  requestAnimationFrame(frame);
}

function setAuto(on){
  auto.on = on;
  autoBtn.classList.toggle('on', on);
  autoBtn.textContent = on ? '停一停' : '自动甩';
  if(on){
    interacted = true;
    if(motion.on) setMotion(false);
    auto.cx = clamp(stick.x, W*0.28, W*0.72);
    auto.cy = clamp(stick.y, H*0.26, H*0.6);
    auto.phase = Math.atan2(stick.y - auto.cy, stick.x - auto.cx);
    ensureAudio(true);
  }
}

autoBtn.addEventListener('click', e => {
  e.stopPropagation();
  setAuto(!auto.on);
});

/* —— 甩手机体感模式：握住手机划圈，重力方向在机身坐标里转动 —— */
const motion = { on: false, ax: 0, ay: 0, bx: 0, by: 0,
                 handler: null, gotEvent: false, enabledAt: 0 };
const motionBtn = document.getElementById('motionBtn');
// devicemotion 只在安全上下文(HTTPS/file)派发，http 下不显示按钮免得点了没反应
if(typeof DeviceMotionEvent !== 'undefined' && 'ontouchstart' in window && window.isSecureContext){
  motionBtn.style.display = '';
}

function flashBtn(btn, text){
  btn.textContent = text;
  btn.disabled = true;
  setTimeout(() => { btn.textContent = '甩手机'; btn.disabled = false; }, 1600);
}

async function setMotion(on){
  if(on && typeof DeviceMotionEvent !== 'undefined'
        && typeof DeviceMotionEvent.requestPermission === 'function'){
    try{
      const r = await DeviceMotionEvent.requestPermission();  // iOS 需授权
      if(r !== 'granted'){ flashBtn(motionBtn, '未授权'); return; }
    }catch(_){ flashBtn(motionBtn, '未授权'); return; }
  }
  motion.on = on;
  motionBtn.classList.toggle('on', on);
  motionBtn.textContent = on ? '停一停' : '甩手机';
  if(on){
    interacted = true;
    if(auto.on) setAuto(false);
    ensureAudio(true);
    motion.ax = motion.ay = motion.bx = motion.by = 0;
    motion.gotEvent = false;
    motion.enabledAt = performance.now();
    if(!motion.handler){
      motion.handler = e => {
        const g = e.accelerationIncludingGravity;
        if(!g || g.x == null) return;
        motion.gotEvent = true;
        // 慢基线滤掉静止重力，留下随挥舞转动的分量
        motion.bx += (g.x - motion.bx)*0.02;
        motion.by += (g.y - motion.by)*0.02;
        motion.ax += ((g.x - motion.bx) - motion.ax)*0.35;
        motion.ay += ((g.y - motion.by) - motion.ay)*0.35;
      };
    }
    window.addEventListener('devicemotion', motion.handler);
  }else if(motion.handler){
    window.removeEventListener('devicemotion', motion.handler);
  }
}
motionBtn.addEventListener('click', e => {
  e.stopPropagation();
  setMotion(!motion.on);
});

cv.addEventListener('pointerdown', e => {
  if(pointer.down) return;                 // 已有手指在甩，忽略误触的第二指
  pointer.down = true;
  pointer.id = e.pointerId;
  // 拇指按住时玩具画在指尖正下会被手挡住，触摸输入把锚点抬到指尖上方
  pointer.lift = e.pointerType === 'touch' ? Math.min(110, ROPE_LEN*0.9) : 0;
  interacted = true;
  cv.classList.add('holding');
  cv.setPointerCapture(e.pointerId);
  if(auto.on) setAuto(false);
  target.x = e.clientX;
  target.y = Math.max(12, e.clientY - pointer.lift);
  ensureAudio(true);
});
cv.addEventListener('pointermove', e => {
  if(!pointer.down || e.pointerId !== pointer.id) return;
  target.x = e.clientX;
  target.y = Math.max(12, e.clientY - pointer.lift);
});
function release(e){
  if(pointer.down && e && e.pointerId !== pointer.id) return;
  pointer.down = false;
  pointer.id = null;
  cv.classList.remove('holding');
  ensureAudio(true);
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);

// 音频解锁只认这些事件：Android Chrome 上触摸授予激活的是 touchend
// (pointerup 在它之前派发、拿不到激活)，click/keydown 覆盖按钮和键盘
['touchend', 'click', 'keydown'].forEach(type =>
  document.addEventListener(type, () => ensureAudio(true), { capture: true, passive: true }));

// 首次开声引导：触屏设备且音频没在跑时显示，解锁后自动消失
const unlockEl = document.getElementById('unlock');
if('ontouchstart' in window) unlockEl.hidden = false;
unlockEl.addEventListener('click', e => {
  e.stopPropagation();
  ensureAudio(true);      // click 自带激活，这里 resume 必然放行
});
function syncUnlock(){
  if(AC && AC.state === 'running'){
    if(!unlockEl.hidden && !unlockEl.classList.contains('gone')){
      unlockEl.classList.add('gone');
      setTimeout(() => { if(unlockEl.classList.contains('gone')) unlockEl.hidden = true; }, 600);
    }
  }else if(needSoundTime > 1.2){
    // 后台切回后重建的上下文没手势解锁不了，自动甩/体感模式又不会再点屏幕——把药丸请回来
    unlockEl.classList.remove('gone');
    unlockEl.hidden = false;
  }
}

// H5 精简版：右上角「关于」按钮、左下角站点链接及关于弹窗已移除
document.addEventListener('keydown', e => { if(e.key === 'Escape'){ skinMask.classList.remove('show'); } });

/* —— 皮肤选择弹窗交互 —— */
const skinBtn   = document.getElementById('skinBtn');
const skinMask  = document.getElementById('skinMask');
const skinClose = document.getElementById('skinClose');
const skinReset = document.getElementById('skinReset');

skinBtn.addEventListener('click', e => { e.stopPropagation(); skinMask.classList.add('show'); });
skinClose.addEventListener('click', e => { e.stopPropagation(); skinMask.classList.remove('show'); });
skinMask.addEventListener('click', e => { if(e.target === skinMask) skinMask.classList.remove('show'); });
skinReset.addEventListener('click', e => { e.stopPropagation(); resetSkin(); });
document.querySelectorAll('.skin-card').forEach(card => {
  card.addEventListener('click', e => {
    e.stopPropagation();
    const id = card.dataset.skin;
    if(id && SKINS[id]) setSkin(id);
  });
});

// 场景切换
function setScene(scene){
  if(!['day','noon','night'].includes(scene)) return;
  currentScene = scene;
  try{ localStorage.setItem('zyl_scene', scene); }catch(_){}
  document.querySelectorAll('.scene-card').forEach(c => c.classList.toggle('active', c.dataset.scene === scene));
  // 更新 theme-color
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta){
    if(scene === 'night') meta.content = '#0d0d2b';
    else if(scene === 'noon') meta.content = '#4da8e0';
    else meta.content = '#bfeaff';
  }
  // 重建所有图层
  buildBgLayer(currentScene);
  buildMoonBambooLayer(currentScene);
  buildFgLayer(currentScene);
}
document.querySelectorAll('.scene-card').forEach(card => {
  card.addEventListener('click', e => {
    e.stopPropagation();
    const scene = card.dataset.scene;
    if(scene) setScene(scene);
  });
});

window.addEventListener('keydown', e => {
  if(e.code === 'Space' && !e.repeat){
    e.preventDefault();
    setAuto(!auto.on);
  }
});

document.addEventListener('visibilitychange', () => {
  if(!AC) return;
  if(document.hidden){
    AC.suspend().catch(() => {});
  }else{
    acAdvanceWall = performance.now();   // 宽限期重置，别把后台冻结误判成僵尸
    AC.resume().catch(() => {});
  }
});
window.addEventListener('pageshow', () => {   // bfcache 恢复时也拉一把
  if(AC){
    acAdvanceWall = performance.now();
    AC.resume().catch(() => {});
  }
});

/* ============================================================
   计数 —— 全站实时(云端 Durable Object) + 个人(浏览器本地)
   ============================================================ */
const API_ORIGIN = location.host === 'zhiliao.y1g.cc'
  ? location.origin                       // 同源走 /api/* 路由
  : 'https://zhiliao.y1g.cc';             // pages.dev / 本地文件 / 局域网 等一律走主域名

const stEls = {
  root: document.getElementById('stats'),
  online: document.getElementById('stOnline'),
  visitors: document.getElementById('stVisitors'),
  visits: document.getElementById('stVisits'),
  wahs: document.getElementById('stWahs'),
  mine: document.getElementById('stMine'),
};

let uid = '', myWah = 0;
try{
  uid = localStorage.getItem('zzl_uid') || '';
  if(!uid){
    uid = (crypto.randomUUID && crypto.randomUUID())
       || (Date.now().toString(36) + Math.random().toString(36).slice(2));
    localStorage.setItem('zzl_uid', uid);
  }
  myWah = parseInt(localStorage.getItem('zzl_mywah') || '0', 10) || 0;
}catch(_){ /* 无痕模式等 localStorage 不可用时静默降级 */ }

// 加载保存的皮肤
try{
  const saved = localStorage.getItem('zzl_skin');
  if(saved && SKINS[saved]) setSkin(saved);
}catch(_){}

// 加载保存的场景
try{
  const savedScene = localStorage.getItem('zyl_scene');
  if(savedScene){
    currentScene = savedScene;
    document.querySelectorAll('.scene-card').forEach(c => c.classList.toggle('active', c.dataset.scene === savedScene));
  }
}catch(_){}

let pendingWah = 0, lastWahs = -1;
const fmt = n => n.toLocaleString('zh-Hans-CN');

function renderStats(m){
  stEls.online.textContent = fmt(m.online);
  stEls.visitors.textContent = fmt(m.visitors);
  stEls.visits.textContent = fmt(m.visits);
  stEls.wahs.textContent = fmt(m.wahs);
  if(lastWahs >= 0 && m.wahs > lastWahs){
    stEls.wahs.classList.remove('wahflash');
    void stEls.wahs.offsetWidth;         // 重启动画
    stEls.wahs.classList.add('wahflash');
  }
  lastWahs = m.wahs;
}
function renderMine(){ stEls.mine.textContent = fmt(myWah); }

let saidHi = false;   // 是否已发过首访(访问+唯一访客)

// 首访上报：每次页面加载记一次访问，并计唯一访客
function reportVisit(){
  if(saidHi) return;
  saidHi = true;
  fetch(API_ORIGIN + '/api/visit', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ uid })
  }).catch(()=>{});
}

// 轮询拉取全站统计（替代 WebSocket 实时推送）
// H5 静态版：连不上云端时自动收缩成只显示个人「哇」数，不显示 – 占位符
let statsFail = 0;
function pollStats(){
  fetch(API_ORIGIN + '/api/stats', { cache:'no-store' })
    .then(r => r.ok ? r.json() : null)
    .then(m => {
      if(m && m.t === 'stats'){ statsFail = 0; renderStats(m); }
      else throw new Error('bad');
    })
    .catch(() => {
      if(++statsFail >= 2 && !stEls.root.dataset.solo){
        stEls.root.dataset.solo = '1';
        stEls.root.innerHTML =
          '我 <b id="stMine">0</b> 哇<br>' +
          '<span class="disclaimer">仅供娱乐与学习交流，严禁用于商业用途</span>';
        stEls.mine = document.getElementById('stMine');
      }
    });
}

// 上报本地攒的哇（1.2s 批量）
function flushWah(){
  if(pendingWah > 0){
    const n = Math.min(pendingWah, 30);
    pendingWah -= n;
    fetch(API_ORIGIN + '/api/wah', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ n })
    }).catch(()=>{});
  }
}

reportVisit();
pollStats();
setInterval(pollStats, 4000);   // 每 4 秒刷新一次在线/计数
setInterval(flushWah, 1200);

// 页面关闭/隐藏前把没上报的哇用 beacon 补上
function beaconWah(){
  if(pendingWah > 0 && navigator.sendBeacon){
    navigator.sendBeacon(API_ORIGIN + '/api/wah', JSON.stringify({ n: pendingWah }));
    pendingWah = 0;
  }
}
window.addEventListener('pagehide', beaconWah);
document.addEventListener('visibilitychange', () => { if(document.hidden) beaconWah(); });

let mySaveTimer = 0;
function addWah(n){
  myWah += n; pendingWah += n;
  renderMine();
  if(!mySaveTimer){
    mySaveTimer = setTimeout(() => {
      mySaveTimer = 0;
      try{ localStorage.setItem('zzl_mywah', String(myWah)); }catch(_){}
    }, 800);
  }
}

stEls.root.hidden = false;
renderMine();
cv.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('resize', resize);
resize();   // 内部会把竹筒挂到屏幕中央，轻轻晃着

// 调试钩子（供自动化验证）
window.__zzl = {
  get state(){ return { rps, active, drive, taut, theta,
    audio: AC ? AC.state : 'none', voice: au ? au.mode : null }; },
  rms(){
    if(!au) return 0;
    const buf = new Float32Array(au.analyser.fftSize);
    au.analyser.getFloatTimeDomainData(buf);
    let s = 0;
    for(let i = 0; i < buf.length; i++) s += buf[i]*buf[i];
    return Math.sqrt(s/buf.length);
  },
  setAuto
};

requestAnimationFrame(frame);
</script>
